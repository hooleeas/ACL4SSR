[custom]

; =======================================================
; DIRECT_CHINA_AUTO_PING
; CF-SUB 中国直连 / 海外服务代理
;
; 核心路由逻辑：
; 1. 广告                         → 🆎 广告拦截
; 2. 海外主流服务                 → 🚀 节点选择
; 3. GFW                         → 🚀 节点选择
; 4. 中国大陆域名 / IP            → 🇨🇳 中国直连
; 5. 其他未命中                   → 🚀 节点选择
;
; 策略组：
; 🚀 节点选择                     → 手动选择，实际使用
; ⏱️ 自动测速                     → 后台每 5 分钟测速
; 🆎 广告拦截                     → REJECT
; 🇨🇳 中国直连                     → DIRECT
; =======================================================


; =======================================================
; 🇨🇳 局域网
; =======================================================

ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/LocalAreaNetwork.list


; =======================================================
; 🆎 广告拦截 / 应用净化
; =======================================================

