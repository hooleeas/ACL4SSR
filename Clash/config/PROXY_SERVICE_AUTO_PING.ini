[custom]

; =======================================================
; CF-SUB 极简分流配置 (PROXY_SERVICE_AUTO_PING)
;
; 路由逻辑：
; 1. 海外服务：常用海外服务及代理规则统一走手动代理节点。
; 2. 广告拦截：拦截常规网页、中文网页及应用内广告。
; 3. 全球直连：其余所有未匹配流量默认 DIRECT。
;
; 策略组定义：
; 🚀 节点选择：纯手动切换，不混入自动选择。
; ⏱️ 后台测速：静默探测节点延迟，不参与实际流量路由。
; 🌍 全球直连：强制绑定 DIRECT 策略。
; 🆎 广告拦截：强制绑定 REJECT 策略。
; =======================================================


; =========================
; 海外服务 / 代理规则
; =========================

; Telegram
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Telegram.list

; 海外媒体
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ProxyMedia.list

