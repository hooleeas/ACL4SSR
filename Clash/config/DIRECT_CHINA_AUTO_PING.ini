; 中国大陆流量       → 🇨🇳 中国直连
; 海外主流服务       → 🚀 节点选择
; GFW 规则           → 🚀 节点选择
; 广告               → 🆎 广告拦截
; 其他未命中流量     → 🚀 节点选择
