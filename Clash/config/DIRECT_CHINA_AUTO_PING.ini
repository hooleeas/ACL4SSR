; =======================================================
; ⑩ 内联独立规则 (修复 Rule Provider 崩溃的核心)
; =======================================================
custom_rule=DOMAIN-SUFFIX,tiktok.com,🚀 节点选择
custom_rule=DOMAIN-SUFFIX,tiktokcdn.com,🚀 节点选择
custom_rule=DOMAIN-SUFFIX,tiktokv.com,🚀 节点选择
custom_rule=DOMAIN-SUFFIX,musical.ly,🚀 节点选择
custom_rule=GEOIP,CN,🇨🇳 中国直连
custom_rule=MATCH,🚀 节点选择


; =======================================================
; ⑪ 策略组 (已增加 []DIRECT 安全兜底，防止 0 节点崩溃)
; =======================================================
custom_proxy_group=🚀 节点选择`select`.*`[]DIRECT
custom_proxy_group=⏱️ 自动测速`url-test`.*`[]DIRECT`http://www.gstatic.com/generate_204`1800,,50
custom_proxy_group=🆎 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🇨🇳 中国直连`select`[]DIRECT`[]🚀 节点选择


; =======================================================
; ⑫ 转换器控制参数
; =======================================================
enable_rule_generator=true
overwrite_original_rules=true
