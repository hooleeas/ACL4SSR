[custom]

; =======================================================
; CF-SUB 极简分流配置
;
; 路由逻辑：
; 1. 中国大陆直连：自定义白名单、局域网、大陆域名及 IP。
; 2. 广告拦截：拦截常规网页、中文网页及应用内广告。
; 3. 默认路由：所有未匹配流量，可选择 DIRECT 或节点代理。
;
; 策略组：
; 🚀 节点选择：手动选择具体代理节点。
; 🌐 默认路由：选择 DIRECT 或 🚀 节点选择。
; 🇨🇳 中国直连：强制 DIRECT。
; 🆎 广告拦截：强制 REJECT。
;
; 已移除：
; ⏱️ 后台测速
; 🌍 全球直连
; =======================================================


; =========================
; 中国大陆直连
; =========================

; 自定义强制直连域名白名单
ruleset=🇨🇳 中国直连,[]DOMAIN-SUFFIX,pomo.mom

; 局域网规则
ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/LocalAreaNetwork.list

; 中国大陆域名
ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaDomain.list

; 中国大陆企业 IP
ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaCompanyIp.list

; 中国大陆 IP 兜底
ruleset=🇨🇳 中国直连,[]GEOIP,CN


; =========================
; 广告拦截
; =========================

; 常规网页广告拦截
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanAD.list

; 软件及 APP 内置广告 / 开屏广告拦截
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanProgramAD.list

; 中文网页广告补充规则
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanEasyListChina.list


; =========================
; 兜底规则
; =========================

; 所有未匹配流量交给默认路由
ruleset=🌐 默认路由,[]FINAL


; =========================
; 策略组配置
; =========================

; 主代理组：手动选择具体节点
custom_proxy_group=🚀 节点选择`select`.*

; 默认路由：DIRECT 或手动代理
custom_proxy_group=🌐 默认路由`select`[]DIRECT`🚀 节点选择

; 中国大陆直连：强制 DIRECT
custom_proxy_group=🇨🇳 中国直连`select`[]DIRECT

; 广告拦截：强制 REJECT
custom_proxy_group=🆎 广告拦截`select`[]REJECT


; =========================
; 转换器控制参数
; =========================

enable_rule_generator=true
overwrite_original_rules=true
