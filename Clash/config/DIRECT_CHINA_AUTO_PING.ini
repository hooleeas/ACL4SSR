; =======================================================
; 🇨🇳 中国大陆 IP
; =======================================================

ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaIp.list
ruleset=🇨🇳 中国直连,[]GEOIP,CN


; =======================================================
; 🐟 最终兜底
; =======================================================

; 所有未命中的流量默认走手动代理节点
ruleset=🚀 节点选择,[]FINAL


; =======================================================
; 🚀 手动节点选择
; =======================================================

; 实际流量使用
; 纯手动，不自动切换
custom_proxy_group=🚀 节点选择`select`.*


; =======================================================
; ⏱️ 后台自动测速
; =======================================================

; 每 300 秒（5 分钟）测速一次
; 测试全部节点
; 仅用于后台测速，不作为实际路由策略
custom_proxy_group=⏱️ 自动测速`url-test`.*`http://www.gstatic.com/generate_204`300,,50


; =======================================================
; 🆎 广告拦截
; =======================================================

custom_proxy_group=🆎 广告拦截`select`[]REJECT


; =======================================================
; 🇨🇳 中国直连
; =======================================================

custom_proxy_group=🇨🇳 中国直连`select`[]DIRECT


; =======================================================
; 规则生成
; =======================================================

enable_rule_generator=true
overwrite_original_rules=true
