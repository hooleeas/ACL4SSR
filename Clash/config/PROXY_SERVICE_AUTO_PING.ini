[custom]

; =======================================================
; CF-SUB 海外服务代理 / 国内直连 极简分流配置
;
; 分流逻辑：
;
; 1. 广告 → 🆎 广告拦截
; 2. 海外主流服务 → 🚀 节点选择
; 3. GFW / 国外媒体 → 🚀 节点选择
; 4. 中国大陆域名 / 中国大陆 IP → 🌍 全球直连
; 5. 其他未命中流量 → 🌍 全球直连
;
; 策略组：
; 🚀 节点选择：纯手动选择具体节点
; ⏱️ 自动测速：后台测速，不参与实际分流
; 🆎 广告拦截：强制 REJECT
; 🌍 全球直连：强制 DIRECT
;
; =======================================================


; =======================================================
; ① 局域网
; =======================================================

ruleset=🌍 全球直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/LocalAreaNetwork.list


; =======================================================
; ② 广告 / 应用净化 / 隐私防护
;
; 广告规则优先于海外服务规则。
; 如果一个域名同时属于广告规则和海外服务规则，
; 优先执行 REJECT。
; =======================================================

; 基础网页广告
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanAD.list

; APP / 软件广告
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanProgramAD.list

; EasyList 国际广告
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanEasyList.list

; EasyList China 中国广告
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanEasyListChina.list

; EasyPrivacy 隐私 / 跟踪
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanEasyPrivacy.list


; =======================================================
; ③ 强制代理：海外主流服务
;
; 这里故意不建立单独的策略组。
; 全部统一进入 🚀 节点选择。
;
; 即使这些服务在中国部分地区可以直接访问，
; 也统一走代理。
; =======================================================

; 苹果全部服务
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Apple.list

; 微软全部服务
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Microsoft.list

; OneDrive
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/OneDrive.list

; 微软 Bing
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Bing.list

; Telegram
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Telegram.list


; =======================================================
; ④ AI 服务
; =======================================================

ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/AI.list

ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/OpenAi.list


