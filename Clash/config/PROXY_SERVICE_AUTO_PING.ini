; =========================
; 全球直连
; =========================

; 所有未匹配流量最终直连
ruleset=🌍 全球直连,[]FINAL


; =========================
; 策略组配置
; =========================

; 主代理组：仅限手动选择具体节点
custom_proxy_group=🚀 节点选择`select`.*

; 后台测速组：静默探测节点延迟，不参与实际流量路由
custom_proxy_group=⏱️ 后台测速`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 全球直连：强制 DIRECT
custom_proxy_group=🌍 全球直连`select`[]DIRECT

; 广告拦截：强制 REJECT
custom_proxy_group=🆎 广告拦截`select`[]REJECT


; =========================
; 转换器控制参数
; =========================

enable_rule_generator=true
overwrite_original_rules=true
