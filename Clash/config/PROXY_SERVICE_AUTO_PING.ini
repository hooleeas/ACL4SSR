; =======================================================
; ⑦ 国内可以直连但属于海外服务的 GoogleCN / SteamCN
;
; 注意：
; 这些规则在这里不再使用 DIRECT。
;
; 因为你的目标是：
;
; “海外大厂即使在国内可以访问，也统一代理”
;
; 所以这里不要把 GoogleCN / SteamCN 加入直连。
; =======================================================


; =======================================================
; ⑧ GFW 海外代理
; =======================================================

ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ProxyGFWlist.list


; =======================================================
; ⑨ 中国大陆直连
;
; 这些规则必须放在海外代理规则之后 / 之前仔细考虑。
;
; Apple / Microsoft / AI / 海外媒体等已经提前命中代理，
; 所以即使它们使用中国 CDN / 中国 IP，也不会被这里覆盖。
; =======================================================

; 中国大陆域名
ruleset=🌍 全球直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaDomain.list

; 中国大陆企业 IP
ruleset=🌍 全球直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaCompanyIp.list

; 中国大陆 IP 段
ruleset=🌍 全球直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaIp.list

; 中国大陆 GEOIP
ruleset=🌍 全球直连,[]GEOIP,CN


; =======================================================
; ⑩ 下载类流量
; =======================================================

ruleset=🌍 全球直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Download.list


; =======================================================
; ⑪ 其他全部直连
;
; 没有命中海外服务、GFW、广告等规则：
; → 🌍 全球直连
;
; 这就是你的“默认直连”。
; =======================================================

ruleset=🌍 全球直连,[]FINAL


; =======================================================
; 策略组
; =======================================================

; =======================================================
; 🚀 节点选择
;
; 纯手动。
; 不加入自动选择、故障转移、负载均衡、国家节点组。
; =======================================================

custom_proxy_group=🚀 节点选择`select`.*


; =======================================================
; ⏱️ 自动测速
;
; 仅后台测速。
; 不作为任何实际规则的策略组。
;
; 1800 秒 = 30 分钟
; =======================================================

custom_proxy_group=⏱️ 自动测速`url-test`.*`http://www.gstatic.com/generate_204`1800,,50


; =======================================================
; 🆎 广告拦截
; =======================================================

custom_proxy_group=🆎 广告拦截`select`[]REJECT


; =======================================================
; 🌍 全球直连
; =======================================================

custom_proxy_group=🌍 全球直连`select`[]DIRECT


; =======================================================
; 转换器控制参数
; =======================================================

enable_rule_generator=true
overwrite_original_rules=true
