[custom]
;不要随意改变关键字，否则会导致出错
; =======================================================
; DIRECT_CHINA_AUTO_PING
; CF-SUB 中国直连 / 海外服务代理 分流配置
; =======================================================

; =======================================================
; ① 局域网及防误杀 (非常重要，防止国内域名被规则误杀)
; =======================================================
