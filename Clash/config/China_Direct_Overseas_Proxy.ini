[custom]

; =======================================================
; CF-SUB 极简分流配置
;
; 路由逻辑：
; 1. 海外服务 → 🚀 节点选择
; 2. 中国大陆 → 🇨🇳 中国直连
; 3. 广告 → 🆎 广告拦截
; 4. 其他未匹配流量 → 🛟 兜底
;
; 节点测速：
; 不使用自动 URLTest
; 使用客户端提供的 ⚡ 手动测速
;
; 兼容：
; Clash / Clash Meta / Mihomo / sing-box
;
; 不使用：
; process_name
; process_path
; url-test
; =======================================================


; =======================================================
; 🌍 海外服务 / 代理规则
; =======================================================

; Telegram
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Telegram.list

; 海外代理基础规则
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ProxyGFWlist.list

; 轻量海外代理规则
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ProxyLite.list


; =======================================================
; 🤖 AI 服务
; =======================================================

ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/AI.list

ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/OpenAi.list


; =======================================================
; 🌐 Google
; =======================================================

ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list


; =======================================================
; 🪟 Microsoft
; =======================================================

; Bing
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Bing.list

; Microsoft / OneDrive / SharePoint 等
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Microsoft.list


; =======================================================
; 🍎 Apple
; =======================================================

ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Apple.list


; =======================================================
; 📺 海外视频
; =======================================================

; YouTube
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/YouTube.list

; Netflix
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/Netflix.list

; Bahamut
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/Bahamut.list


; =======================================================
; 🎮 海外游戏平台
; =======================================================

; Epic
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/Epic.list

; EA / Origin
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/Origin.list

; Sony / PlayStation
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/Sony.list

; Steam
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/Steam.list

; Nintendo
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/Nintendo.list


; =======================================================
; 🇨🇳 中国大陆直连
; =======================================================

; 自定义中国大陆域名
ruleset=🇨🇳 中国直连,[]DOMAIN-SUFFIX,pomo.mom

; 中国大陆域名
ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaDomain.list

; 中国大陆公司 IP
ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaCompanyIp.list

; 中国大陆 IP
ruleset=🇨🇳 中国直连,[]GEOIP,CN


; =======================================================
; 🆎 广告拦截
; =======================================================

; 常规网页广告
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanAD.list

; 软件及 APP 内置广告 / 开屏广告
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanProgramAD.list

; EasyList 通用广告
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanEasyList.list

; EasyList China 中文网页广告
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanEasyListChina.list


; =======================================================
; 🛟 兜底
; =======================================================

; 所有未匹配流量进入兜底
ruleset=🛟 兜底,[]FINAL


; =======================================================
; 🚀 节点选择
;
; 纯手动选择节点
; 不包含自动选择
; 不包含 URLTest
; =======================================================

custom_proxy_group=🚀 节点选择`select`.*


; =======================================================
; 🇨🇳 中国直连
;
; 强制 DIRECT
; =======================================================

custom_proxy_group=🇨🇳 中国直连`select`[]DIRECT


; =======================================================
; 🆎 广告拦截
;
; 强制 REJECT
; =======================================================

custom_proxy_group=🆎 广告拦截`select`[]REJECT


; =======================================================
; 🛟 兜底
;
; DIRECT / 手动节点
; =======================================================

custom_proxy_group=🛟 兜底`select`[]DIRECT`[]🚀 节点选择


; =======================================================
; 转换器控制参数
; =======================================================

enable_rule_generator=true
overwrite_original_rules=true
