[custom]

; =======================================================
; CF-SUB 海外服务代理 / 国内直连 极简分流配置
;
; 分流逻辑：
;
; 中国大陆流量       → 🌍 全球直连
; 已知海外服务       → 🚀 节点选择
; GFW / 国外媒体     → 🚀 节点选择
; 广告 / 应用净化     → 🆎 广告拦截
; 下载类流量         → 🌍 全球直连
; 其他未命中流量     → 🌍 全球直连
;
; 策略组：
;
; 🚀 节点选择         → 纯手动选择具体节点
; ⏱️ 自动测速         → 后台测速，不参与实际分流
; 🆎 广告拦截         → 强制 REJECT
; 🌍 全球直连         → 强制 DIRECT
;
; =======================================================


; =======================================================
; ① 局域网
; =======================================================

ruleset=🌍 全球直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/LocalAreaNetwork.list


; =======================================================
; ② 广告拦截 / 应用净化 / 隐私防护
