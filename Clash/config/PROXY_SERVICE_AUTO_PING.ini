; =======================================================

ruleset=🌍 全球直连,[]FINAL


; =======================================================
; ⑬ 策略组
; =======================================================

; 🚀 节点选择
; 纯手动选择具体节点
custom_proxy_group=🚀 节点选择`select`.*

; ⏱️ 自动测速
; 后台测速，不参与实际分流
; 1800 秒 = 30 分钟
custom_proxy_group=⏱️ 自动测速`url-test`.*`http://www.gstatic.com/generate_204`1800,,50

; 🆎 广告拦截
; 强制使用 REJECT
custom_proxy_group=🆎 广告拦截`select`[]REJECT

; 🌍 全球直连
; 强制使用 DIRECT
custom_proxy_group=🌍 全球直连`select`[]DIRECT


; =======================================================
; ⑭ 转换器控制参数
; =======================================================

enable_rule_generator=true
overwrite_original_rules=true
