; =======================================================
; ⑦ Google / FCM
;
; GoogleCN 在这里不再 DIRECT。
; 即使 Google 服务在中国大陆可以访问，
; 仍然统一进入 🚀 节点选择。
; =======================================================

; Google FCM
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list

; 中国可访问的 Google 服务也强制代理
ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/GoogleCN.list


; =======================================================
; ⑧ TikTok
;
; TikTok 在部分中国大陆网络环境可能存在可访问情况，
; 这里明确强制进入 🚀 节点选择。
; =======================================================

ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,tiktok.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,tiktokcdn.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,tiktokv.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,musical.ly


; =======================================================
; ⑨ GFW 海外代理
; =======================================================

ruleset=🚀 节点选择,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ProxyGFWlist.list


; =======================================================
; ⑩ 中国大陆直连
;
; 参考 BypassCN_NoAuto_Ping 的中国直连结构。
;
; 中国直连规则包含：
; - 中国大陆域名
; - 中国大陆企业 IP
; - 中国大陆 IP 段
; - GEOIP CN
;
; 海外服务规则已经在本区域之前处理，
; 因此海外服务优先于中国大陆 IP 判断。
; =======================================================

; 中国大陆域名
ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaDomain.list

; 中国大陆企业 IP
ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaCompanyIp.list

; 中国大陆 IP 段
ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaIp.list

; 中国大陆 GEOIP
ruleset=🇨🇳 中国直连,[]GEOIP,CN


; =======================================================
; ⑪ 最终兜底
;
; 没有命中：
; - 广告规则
; - 海外服务规则
; - GFW 规则
; - 中国大陆规则
;
; → 🚀 节点选择
;
; 因此最终逻辑为：
;
; 中国大陆 → 🇨🇳 中国直连
; 已知海外服务 → 🚀 节点选择
; 其他未命中 → 🚀 节点选择
; =======================================================

ruleset=🚀 节点选择,[]FINAL


; =======================================================
; 策略组
; =======================================================

; =======================================================
; 🚀 节点选择
;
; 纯手动选择具体节点。
; 不加入自动选择、故障转移、负载均衡、
; 国家节点组等内置策略。
; =======================================================

custom_proxy_group=🚀 节点选择`select`.*


; =======================================================
; ⏱️ 自动测速
;
; 后台探测节点延迟。
; 不参与任何实际分流。
;
; 1800 秒 = 30 分钟
; =======================================================

custom_proxy_group=⏱️ 自动测速`url-test`.*`http://www.gstatic.com/generate_204`1800,,50


; =======================================================
; 🆎 广告拦截
;
; 强制使用 REJECT。
; =======================================================

custom_proxy_group=🆎 广告拦截`select`[]REJECT


; =======================================================
; 🇨🇳 中国直连
;
; 强制使用 DIRECT。
; =======================================================

custom_proxy_group=🇨🇳 中国直连`select`[]DIRECT


; =======================================================
; 转换器控制参数
; =======================================================

enable_rule_generator=true
overwrite_original_rules=true
