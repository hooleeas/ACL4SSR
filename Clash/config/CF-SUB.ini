[custom]

;不要随意改变关键字，否则会导致出错
;CF-SUB 极简分流配置
;
;功能：
;中国大陆网站/IP -> 🇨🇳 大陆直连
;广告 -> 🛑 广告拦截
;其他所有流量 -> 🚀 节点选择
;
;策略组：
;🚀 节点选择：仅允许手动选择具体代理节点
;⏱️ 后台测速 (无需理会)：独立测速，不参与实际分流
;🇨🇳 大陆直连：仅允许 DIRECT
;🛑 广告拦截：仅允许 REJECT
;
;注意：
;⏱️ 后台测速不会加入🚀 节点选择
;🚀 节点选择不会包含DIRECT、REJECT或其他策略组
;后台测速每1小时执行一次
;实际代理流量始终使用用户手动选择的节点

; =========================
; 中国大陆直连
; =========================

ruleset=🇨🇳 大陆直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🇨🇳 大陆直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🇨🇳 大陆直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🇨🇳 大陆直连,[]GEOIP,CN

; =========================
; 广告拦截
; =========================

ruleset=🛑 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/BanEasyListChina.list

; =========================
; 其他所有流量
; =========================

ruleset=🚀 节点选择,[]FINAL

; =========================
; 策略组
; =========================

; 手动选择具体代理节点
; 不加入DIRECT
; 不加入REJECT
; 不加入其他策略组
custom_proxy_group=🚀 节点选择`select`.*

; 独立后台测速组
; 不参与任何ruleset
; 不作为实际代理出口
; 每3600秒（1小时）测速一次
custom_proxy_group=⏱️ 后台测速 (无需理会)`url-test`.*`http://www.gstatic.com/generate_204`3600,,50

; 仅允许DIRECT
custom_proxy_group=🇨🇳 大陆直连`select`[]DIRECT

; 仅允许REJECT
custom_proxy_group=🛑 广告拦截`select`[]REJECT

; =========================
; 订阅转换器
; =========================

enable_rule_generator=true
overwrite_original_rules=true
