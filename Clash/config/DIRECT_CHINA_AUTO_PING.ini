[custom]

; =======================================================
; DIRECT_CHINA_AUTO_PING
; CF-SUB 中国直连 / 海外服务代理 分流配置
;
; 分流逻辑：
; 中国大陆流量       → 🇨🇳 中国直连
; 已知海外服务       → 🚀 节点选择
; 广告及跟踪         → 🆎 广告拦截
; GFW 规则           → 🚀 节点选择
; 其他未命中流量     → 🚀 节点选择
;
; 策略组：
; 🚀 节点选择         → 纯手动选择节点
; ⏱️ 自动测速         → 后台测速，不参与分流
; 🆎 广告拦截         → REJECT
; 🇨🇳 中国直连         → DIRECT
;
; =======================================================


; =======================================================
; ① 局域网
; =======================================================

ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/hooleeas/ACL4SSR/master/Clash/LocalAreaNetwork.list


; =======================================================
; ② 广告拦截 / 应用净化 / 隐私防护
