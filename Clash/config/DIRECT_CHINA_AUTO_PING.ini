[custom]

; =======================================================
; CF-SUB 极简分流配置
;
; 路由逻辑：
; 1. 中国大陆直连
; 2. 广告拦截
; 3. 其余流量进入默认路由
; 4. 默认路由支持 DIRECT / 手动节点选择
; 5. 后台测速独立运行，不参与分流
; =======================================================


; =======================================================
; 🇨🇳 中国直连
; =======================================================

ruleset=🇨🇳 中国直连,[]DOMAIN-SUFFIX,pomo.mom
ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🇨🇳 中国直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🇨🇳 中国直连,[]GEOIP,CN


; =======================================================
; 🆎 广告拦截
; =======================================================

ruleset=🆎 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🆎 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list


; =======================================================
; 🌐 默认路由
; =======================================================

ruleset=🌐 默认路由,[]FINAL


; =======================================================
; 策略组
; =======================================================

; 手动节点选择
custom_proxy_group=🚀 节点选择`select`.*

; 默认路由
; 可选择直连，也可以进入手动节点选择
custom_proxy_group=🌐 默认路由`select`[]DIRECT`[]🚀 节点选择

; 中国大陆直连
custom_proxy_group=🇨🇳 中国直连`select`[]DIRECT

; 广告拦截
custom_proxy_group=🆎 广告拦截`select`[]REJECT

; 后台测速
; 测试全部节点
; 每 300 秒测速一次（5 分钟）
; 仅负责测速，不参与任何分流
custom_proxy_group=⏱️ 后台测速`url-test`.*`http://www.gstatic.com/generate_204`300,,50


; =======================================================
; 规则生成
; =======================================================

enable_rule_generator=true
overwrite_original_rules=true
